services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: aether-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - Aether

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: aether-clickhouse
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${CLICKHOUSE_PORT_HTTP}:8123"
      - "${CLICKHOUSE_PORT_NATIVE}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    networks:
      - Aether

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: aether-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "${MINIO_PORT_API}:9000"
      - "${MINIO_PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - Aether

  minio-init:
    image: minio/mc:latest
    container_name: aether-minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb myminio/${S3_BUCKET} --ignore-existing;
      echo 'bucket ${S3_BUCKET} ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio:
        condition: service_started
    networks:
      - Aether

  backend:
    hostname: backend
    container_name: aether-backend
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      RUST_LOG: ${RUST_LOG}
      TZ: ${TZ}
      SERVER_PATH: ${SERVER_PATH}
      DB_LOCATION: ${DB_LOCATION}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      API_KEY: ${API_KEY}
    networks:
      - Aether

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        BACKEND_URL: http://backend:8080
        API_KEY: ${API_KEY}
    container_name: aether-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      BACKEND_URL: http://backend:8080
      API_KEY: ${API_KEY}
      AUTH_CODE: ${AUTH_CODE}
    networks:
      - Aether

networks:
  Aether:
    external: true

volumes:
  pgdata:
  chdata:
  miniodata:
