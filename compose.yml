services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: aether-clickhouse
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${CLICKHOUSE_PORT_HTTP}:8123"
      - "${CLICKHOUSE_PORT_NATIVE}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    healthcheck:
      test: wget -qO- http://localhost:8123/ping
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - Aether

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: aether-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "${MINIO_PORT_API}:9000"
      - "${MINIO_PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://minio:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - Aether

  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD); do sleep 3; done;
      /usr/bin/mc mb myminio/${S3_BUCKET} || echo 'Bucket already exists';
      /usr/bin/mc admin user add myminio $S3_ACCESS_KEY $S3_SECRET_KEY 2>/dev/null || echo 'User already exists';
      /usr/bin/mc admin policy attach myminio readwrite --user $S3_ACCESS_KEY 2>/dev/null || echo 'Policy already attached';
      "
    networks:
      - Aether

  backend:
    hostname: backend
    container_name: aether-backend
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:8080"
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      RUST_LOG: ${RUST_LOG}
      TZ: ${TZ}
      SERVER_PATH: ${SERVER_PATH}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      API_KEY: ${API_KEY}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    networks:
      - Aether

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        BACKEND_URL: http://backend:8080
        API_KEY: ${API_KEY}
    container_name: aether-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      BACKEND_URL: http://backend:8080
      API_KEY: ${API_KEY}
      AUTH_CODE: ${AUTH_CODE}
    networks:
      - Aether

  # Scanning agent. No container_name / no host port binding so it can be
  # replicated: `docker compose up -d --scale agent=N`. Agents self-register
  # with the backend and only make outbound calls, so N instances just work.
  agent:
    build:
      context: ./agent
    restart: always
    depends_on:
      backend:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG}
      TZ: ${TZ}
      AGENT_PORT: ${AGENT_PORT}
      EXTERNAL_SERVER_PATH: ${EXTERNAL_SERVER_PATH}
      API_KEY: ${API_KEY}
      SCANS_OUTPUT_PATH: ${SCANS_OUTPUT_PATH}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS}
      SCAN_COOLDOWN: ${SCAN_COOLDOWN}
      HXN_DELAY: ${HXN_DELAY}
      HTTPX_THREADS: ${HTTPX_THREADS}
      HTTPX_RATE_LIMIT: ${HTTPX_RATE_LIMIT}
      HTTPX_TIMEOUT: ${HTTPX_TIMEOUT}
      HTTPX_SCREENSHOTS: ${HTTPX_SCREENSHOTS}
      HTTPX_WEB_PORTS: ${HTTPX_WEB_PORTS:-80,443,8080,8443,8000,8888}
      NUCLEI_ENABLED: ${NUCLEI_ENABLED}
      NUCLEI_SEVERITY: ${NUCLEI_SEVERITY}
      NUCLEI_TAGS: ${NUCLEI_TAGS}
      NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT}
      NUCLEI_CONCURRENCY: ${NUCLEI_CONCURRENCY}
      NUCLEI_TIMEOUT: ${NUCLEI_TIMEOUT}
      TLSX_CONCURRENCY: ${TLSX_CONCURRENCY}
      TLSX_TIMEOUT: ${TLSX_TIMEOUT}
      DNSX_THREADS: ${DNSX_THREADS}
      GEO_ENABLED: ${GEO_ENABLED:-true}
      PROXIES: ${PROXIES}
    networks:
      - Aether

networks:
  Aether:
    driver: bridge

volumes:
  chdata:
  miniodata:
