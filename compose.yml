services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: aether-clickhouse
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${CLICKHOUSE_PORT_HTTP}:8123"
      - "${CLICKHOUSE_PORT_NATIVE}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    healthcheck:
      test: wget -qO- http://localhost:8123/ping
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - Aether

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: aether-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - Aether

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: aether-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "${MINIO_PORT_API}:9000"
      - "${MINIO_PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - Aether

  minio-init:
    image: minio/mc:latest
    container_name: aether-minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb myminio/${S3_BUCKET} --ignore-existing;
      echo 'bucket ${S3_BUCKET} ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio:
        condition: service_started
    networks:
      - Aether

  backend:
    hostname: backend
    container_name: aether-backend
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:8080"
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      RUST_LOG: ${RUST_LOG}
      TZ: ${TZ}
      SERVER_PATH: ${SERVER_PATH}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      REDIS_URL: ${REDIS_URL}
      API_KEY: ${API_KEY}
    networks:
      - Aether

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        BACKEND_URL: http://backend:8080
        API_KEY: ${API_KEY}
    container_name: aether-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      BACKEND_URL: http://backend:8080
      API_KEY: ${API_KEY}
      AUTH_CODE: ${AUTH_CODE}
    networks:
      - Aether

  agent:
    hostname: agent
    container_name: aether-agent
    build:
      context: ./agent
    privileged: true
    security_opt:
      - seccomp=unconfined
    ports:
      - "8020:8020"
    shm_size: "256mb"
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-UTC}
      SERVER_PATH: 0.0.0.0:8020
      EXTERNAL_SERVER_PATH: http://backend:8080
      SCANS_OUTPUT_PATH: /data/scans
      HXN_DELAY: ${HXN_DELAY:-5}
      IMAGE_OUTPUT_PATH: /data/images
      API_KEY: ${API_KEY}
      AGENT_ADDRESS: agent
    volumes:
      - ./agent/screenshots:/app/screenshots
    networks:
      - Aether

networks:
  Aether:

volumes:
  chdata:
  redisdata:
  miniodata:
