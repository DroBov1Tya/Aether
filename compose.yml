services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: aether-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - Aether

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: aether-clickhouse
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${CLICKHOUSE_PORT_HTTP}:8123"
      - "${CLICKHOUSE_PORT_NATIVE}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    networks:
      - Aether

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: aether-minio
    command: server /data --console-address ":${MINIO_PORT_CONSOLE}"
    restart: always
    ports:
      - "${MINIO_PORT_API}:9000"
      - "${MINIO_PORT_CONSOLE}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - Aether

  backend:
    hostname: backend
    container_name: aether-backend
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG}
      TZ: ${TZ}
      SERVER_PATH: ${SERVER_PATH}
      DB_LOCATION: ${DB_LOCATION}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      API_KEY: ${API_KEY}
    networks:
      - Aether

networks:
  Aether:
    external: true

volumes:
  pgdata:
  chdata:
  miniodata:
