[package]
name = "agent"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-listener = "0.3.0"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1.1"
dotenv = "0.15.0"
obfstr = "0.4.4"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["json", "socks", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi"] }
